[package]
name = "FuckACE"
version = "1.0.0"
description = "FuckACE是一个用来优化ACE游戏的免安装开源工具"
authors = ["shshouse"]
edition = "2021"

[package.metadata.windows.manifest]
path = "src/manifest.xml"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fuck_ace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation", "Win32_Security", "Win32_System_ProcessStatus", "Win32_System_Com", "Win32_UI_Shell"] }
tokio = { version = "1", features = ["full"] }
winreg = "0.52"
tauri-plugin-single-instance = "2.4.0"
base64 = "0.22"

